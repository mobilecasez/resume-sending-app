[phases.setup]
# System libraries required by Playwright's chromium-headless-shell.
# Without these the browser binary exists but cannot start in production
# ("error while loading shared libraries: libglib-2.0.so.0") — which broke
# all resume/cover-letter preview + PDF rendering on Railway.
aptPkgs = [
  "libglib2.0-0",
  "libnss3",
  "libnspr4",
  "libdbus-1-3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libatspi2.0-0",
  "libcups2",
  "libdrm2",
  "libexpat1",
  "libxcb1",
  "libxkbcommon0",
  "libx11-6",
  "libx11-xcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "fonts-liberation",
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
