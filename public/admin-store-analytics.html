<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Analytics — CVApplyr Admin</title>
  <style>
    :root { --bg:#0B1120; --panel:#111a2e; --line:#22304d; --txt:#E2E8F0; --muted:#94A3B8; --cyan:#06B6D4; --blue:#3B82F6; --green:#34D399; --amber:#FB923C; --red:#F87171; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 64px; }
    h1 { font-size:22px; font-weight:800; letter-spacing:-0.5px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 12px; }
    .stat { font-size:26px; font-weight:800; }
    .stat-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
    .section { margin-top:20px; }
    .note { background:rgba(251,146,60,0.12); border:1px solid rgba(251,146,60,0.35); color:#FCD9B6; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; }
    .ok-pill { display:inline-block; font-size:10px; font-weight:700; color:var(--green); background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.3); padding:2px 8px; border-radius:999px; vertical-align:middle; margin-left:8px; }
    .warn-pill { color:var(--amber); background:rgba(251,146,60,0.12); border-color:rgba(251,146,60,0.3); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
    .row-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .controls { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .controls input, .controls button { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; font-size:13px; }
    .controls button { cursor:pointer; background:linear-gradient(90deg,var(--cyan),var(--blue)); border:none; font-weight:700; }
    .muted { color:var(--muted); }
    .err { color:var(--red); }
    a.back { color:var(--cyan); text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/dashboard">← Dashboard</a>
    <h1 style="margin-top:10px;">📊 Store Analytics</h1>
    <div class="sub">Downloads &amp; sales from the App Store + Google Play, and our recorded transactions. Store download/sales figures lag ~1 day.</div>

    <div class="controls">
      <label class="muted" style="font-size:12px;">Apple date <input type="date" id="appleDate" /></label>
      <label class="muted" style="font-size:12px;">Google month <input type="month" id="googleMonth" /></label>
      <button id="refreshBtn">Refresh</button>
      <span id="asOf" class="muted" style="font-size:12px;"></span>
    </div>

    <div id="accessDenied"></div>
    <div id="content" style="display:none;">

      <!-- Apple -->
      <div class="section">
        <div class="row-head"><h2 style="margin:0;">🍏 Apple App Store <span id="appleStatus"></span></h2></div>
        <div id="appleBody"></div>
      </div>

      <!-- Google -->
      <div class="section">
        <div class="row-head"><h2 style="margin:0;">🤖 Google Play <span id="googleStatus"></span></h2></div>
        <div id="googleBody"></div>
      </div>

      <!-- Recorded transactions -->
      <div class="section">
        <div class="row-head"><h2 style="margin:0;">💳 Recorded transactions (our DB)</h2></div>
        <div id="localBody"></div>
      </div>
    </div>

    <div id="loading" class="muted" style="padding:30px 0;">Loading…</div>
  </div>

  <script>
    var authToken = localStorage.getItem('authToken');
    if (!authToken) { window.location.href = '/login'; }
    var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : 'https://cvapplyr.com';

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function num(n){ return (n==null?0:n).toLocaleString(); }
    function money(n,c){ return (c||'') + ' ' + (Math.round((n||0)*100)/100).toLocaleString(); }

    function statCard(value, label){ return '<div class="card"><div class="stat">'+value+'</div><div class="stat-lbl">'+esc(label)+'</div></div>'; }

    function renderStore(target, statusEl, d, kind){
      if (!d || d.configured === false) {
        statusEl.innerHTML = '<span class="ok-pill warn-pill">needs setup</span>';
        document.getElementById(target).innerHTML = '<div class="note">'+esc((d&&d.reason)||'Not configured.')+'</div>';
        return;
      }
      statusEl.innerHTML = '<span class="ok-pill">live</span>';
      var html = '<div class="grid">';
      if (kind === 'apple') {
        html += statCard(num(d.downloads), 'App units ('+esc(d.date||'')+')');
        html += statCard(num(d.inAppUnits), 'In-app units');
        html += statCard(money(d.proceeds,'$'), 'Proceeds');
      } else {
        html += statCard(num(d.totalInstalls), 'Installs ('+esc(d.month||'')+')');
        if (d.series && d.series.length) html += statCard(num(d.series[d.series.length-1].installs), 'Latest day');
      }
      html += '</div>';
      if (d.note) html += '<div class="note" style="margin-top:12px;">'+esc(d.note)+'</div>';
      document.getElementById(target).innerHTML = html;
    }

    function renderLocal(d){
      var el = document.getElementById('localBody');
      if (!d) { el.innerHTML = '<div class="muted">No data.</div>'; return; }
      var html = '';
      var w = d.completedTxns || {};
      html += '<div class="grid">'
        + statCard(num(w.last_24h), 'Txns · 24h')
        + statCard(num(w.last_7d), 'Txns · 7d')
        + statCard(num(w.last_30d), 'Txns · 30d')
        + statCard(num(w.all_time), 'Txns · all time')
        + statCard(num((d.credits||{}).credits_sold), 'Credits sold')
        + '</div>';
      var bp = d.byPlatform || [];
      if (bp.length) {
        html += '<div class="card" style="margin-top:12px;"><h2>Revenue by platform</h2><table><tr><th>Platform</th><th>Txns</th><th>Paying users</th><th>Revenue</th></tr>';
        bp.forEach(function(r){ html += '<tr><td>'+esc(r.platform)+'</td><td>'+num(r.txns)+'</td><td>'+num(r.paying_users)+'</td><td>'+money(r.revenue, r.currency||'')+'</td></tr>'; });
        html += '</table></div>';
      }
      var rec = d.recent || [];
      if (rec.length) {
        html += '<div class="card" style="margin-top:12px;"><h2>Recent transactions</h2><table><tr><th>When</th><th>Platform</th><th>User</th><th>Plan</th><th>Amount</th></tr>';
        rec.forEach(function(r){ html += '<tr><td>'+esc((r.created_at||'').toString().slice(0,16).replace('T',' '))+'</td><td>'+esc(r.platform)+'</td><td>'+esc(r.user_id)+'</td><td>'+esc(r.plan_id)+'</td><td>'+money(r.amount, r.currency||'')+'</td></tr>'; });
        html += '</table></div>';
      }
      if (d.error) html += '<div class="note" style="margin-top:12px;">DB note: '+esc(d.error)+'</div>';
      el.innerHTML = html;
    }

    async function load(){
      document.getElementById('loading').style.display = 'block';
      var qs = [];
      var ad = document.getElementById('appleDate').value; if (ad) qs.push('date='+ad);
      var gm = document.getElementById('googleMonth').value; if (gm) qs.push('month='+gm.replace('-',''));
      try {
        var resp = await fetch(API_BASE + '/api/admin/store-analytics' + (qs.length?('?'+qs.join('&')):''), { headers: { 'Authorization': 'Bearer ' + authToken } });
        if (resp.status === 403) { showDenied(); return; }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var data = await resp.json();
        renderStore('appleBody', document.getElementById('appleStatus'), data.apple, 'apple');
        renderStore('googleBody', document.getElementById('googleStatus'), data.google, 'google');
        renderLocal(data.local);
        document.getElementById('asOf').textContent = 'as of ' + (data.generatedAt||'').toString().slice(0,19).replace('T',' ') + ' UTC';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        document.getElementById('content').style.display = 'block';
        document.getElementById('localBody').innerHTML = '<div class="err">Failed to load: '+esc(e.message)+'</div>';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
    function showDenied(){
      document.getElementById('loading').style.display='none';
      document.getElementById('content').style.display='none';
      document.getElementById('accessDenied').innerHTML = '<div class="note">⛔ Access denied — admin only. <a class="back" href="/dashboard">Go to dashboard</a></div>';
    }
    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
