<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.125rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <p class="loading-text">Completing authentication...</p>
    </div>

    <script>
        // Extract token and user data from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const userStr = params.get('user');

        if (token && userStr) {
            try {
                const user = JSON.parse(decodeURIComponent(userStr));

                // Check if we're in a mobile browser / Custom Tab — try deep link first
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (isMobile) {
                    // Redirect to app via deep link
                    const deepLink = 'cvapplyr://oauth-success?token=' + encodeURIComponent(token) + '&user=' + encodeURIComponent(JSON.stringify(user));
                    window.location.href = deepLink;
                    // Fallback: if deep link doesn't work after 2 seconds, go to web dashboard
                    setTimeout(function() {
                        localStorage.setItem('authToken', token);
                        localStorage.setItem('userData', JSON.stringify(user));
                        window.location.href = '/dashboard';
                    }, 2000);
                } else {
                    // Web browser: store and redirect
                    localStorage.setItem('authToken', token);
                    localStorage.setItem('userData', JSON.stringify(user));
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('Error parsing auth data:', error);
                window.location.href = '/login?error=auth-failed';
            }
        } else {
            console.error('Missing token or user data');
            window.location.href = '/login?error=missing-data';
        }
    </script>
</body>
</html>
